name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: 単体テスト・手触りの数値テスト
        run: npx vitest run
      - name: ビルド
        run: npx vite build
      - name: ブラウザでの通し確認
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: 撮影した画像を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ゲームで動く人物の GLB の確かめ（全部の頂点の床の接地・原点・重み。test_models は骨と目印の点だけを見る）
        # yana・burton（ゲームでは idle だけ）と、前の版・試作のハルは今わかっている失敗があるので外す（test_models の KNOWN）
        run: |
          python -m pip install --quiet numpy
          python tools/blender/recon/glb_audit.py --strict godot/assets/models/haru_r.glb godot/assets/models/junker.glb \
            godot/assets/models/nico.glb godot/assets/models/shopkeeper.glb godot/assets/models/trude.glb \
            godot/assets/models/tf_*.glb
      - name: Godot を用意
        run: bash tools/setup_godot.sh
      - name: 素材の取り込み
        run: tools/godot.sh import
      - name: 手触りの数値・戦闘・仕掛けのテスト（Godot 版）
        run: tools/godot.sh test
      - name: 通しの確認（起動 → 会話 → ロックオン → ドリル）
        run: tools/godot.sh run --fixed-fps 60 -- --demo=/tmp/demo
