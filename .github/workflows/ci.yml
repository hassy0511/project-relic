name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: 単体テスト・手触りの数値テスト
        run: npx vitest run
      - name: ビルド
        run: npx vite build
      - name: ブラウザでの通し確認
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: 撮影した画像を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot を用意
        run: bash tools/setup_godot.sh
      - name: 素材の取り込み
        run: tools/godot.sh import
      - name: 手触りの数値・戦闘・仕掛けのテスト（Godot 版）
        run: tools/godot.sh test
      - name: 通しの確認（起動 → 会話 → ロックオン → ドリル）
        run: tools/godot.sh run --fixed-fps 60 -- --demo=/tmp/demo
