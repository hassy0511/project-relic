name: 試遊版を GitHub Pages に公開

# URL の直下：Godot 版のブラウザ版（軽い描画方式）
# /threejs/：以前の three.js 版（見た目の確認ページ lookdev.html を含む）
# /dashboard/：開発ダッシュボード（docs/dashboard.md から作る）
# /models/：3D モデルの確認ページ（tools/model_viewer/index.html ＋ GLB）
on:
  push:
    branches: ['claude/busy-bell-oagnck', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Godot と書き出し用の部品を用意
        run: bash tools/setup_godot.sh --templates
      - name: 素材の取り込み
        run: tools/godot.sh import
      - name: ブラウザ版を書き出す
        run: |
          mkdir -p build/web
          .tools/godot/godot --headless --path godot --export-release "Web" ../build/web/index.html
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p site
          cp -r build/web/* site/
          cp -r dist site/threejs
          python3 tools/build_dashboard.py site/dashboard
          mkdir -p site/models
          cp tools/model_viewer/index.html tools/model_viewer/*.glb godot/assets/models/*.glb site/models/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
